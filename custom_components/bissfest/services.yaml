add_water:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: bissfest
    ml:
      required: true
      example: 250
      selector:
        number:
          min: -3000
          max: 3000
          step: 50
          unit_of_measurement: ml
          mode: box

log_weight:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: bissfest
    kg:
      required: true
      example: 77.2
      selector:
        number:
          min: 20
          max: 400
          step: 0.1
          unit_of_measurement: kg
          mode: box
    date:
      selector:
        date:

add_drink:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: bissfest
    kind:
      required: true
      default: coffee
      selector:
        select:
          options:
            - coffee
            - tea
          translation_key: kind
    size:
      required: true
      default: cup
      selector:
        select:
          options:
            - cup
            - mug
          translation_key: size

undo_drink:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: bissfest
    kind:
      required: true
      default: coffee
      selector:
        select:
          options:
            - coffee
            - tea
          translation_key: kind
